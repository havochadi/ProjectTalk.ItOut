services:
  # ── Database ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: projecttalk-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: talkitout
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - projecttalk-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: projecttalk-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - projecttalk-network

  # ── API ───────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: projecttalk-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/talkitout
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_min_32_chars}
      ACCESS_TOKEN_TTL_MIN: 15
      REFRESH_TOKEN_TTL_DAYS: 7
      # Allow requests from the containerised web frontend AND local dev
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://web}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gemini-2.0-flash}
      ALLOW_EXTERNAL_PII: false
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-Rachel}
      CRISIS_EMERGENCY: 999
      CRISIS_SOS_LINE: 1767
      CRISIS_SOS_TEXT: "9151 1767"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - projecttalk-network

  # ── Web Frontend ──────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: projecttalk-web
    profiles:
      - prod-web
    restart: unless-stopped
    ports:
      - '80:80'
    environment:
      # The web app is a static SPA; env vars are baked in at build time.
      # Set VITE_API_URL if your API is not at http://localhost:4000 in prod.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    depends_on:
      - api
    networks:
      - projecttalk-network

networks:
  projecttalk-network:
    driver: bridge

volumes:
  mongo-data:
